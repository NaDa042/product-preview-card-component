<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <picture class="perfume">
      <img src="images/image-product-mobile.jpg" alt="image-product-mobile" class="image-product-mobile">
      <img src="images/image-product-desktop.jpg" alt="image-product-desktop" class="image-product-desktop">
    </picture>
    <p class="typeOf">Perfume</p>
    <h1>Gabrielle Essence Eau De Parfum</h1>
    <p class="discription">
      A floral, solar and voluptuous interpretation composed by Olivier Polge,
      Perfumer-Creator for the House of CHANEL.
    </p>
    <div class="price">
      <p class="newPrice">$149.99</p>
      <p class="oldPrice">$169.99</p>
    </div>
    <button type="button" class="addToCart"><img src="images/icon-cart.svg" class="cartPic" alt="cart" > Add to Cart</button>
    
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
